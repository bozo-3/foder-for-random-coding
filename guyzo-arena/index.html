<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111d">
<title>GUYZO: Neon Uprising</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111d;color:#e8faff;font-family:system-ui,sans-serif}.app{max-width:1000px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:clamp(22px,5vw,36px);font-weight:900;letter-spacing:4px;color:#67f2ff;text-shadow:0 0 18px #25ddff88}.tag{font:10px monospace;color:#91aeba;letter-spacing:2px}.btn,.card{color:#eaffff;background:#102536;border:1px solid #347384;border-radius:9px;padding:10px 14px;cursor:pointer}.btn:hover,.card:hover{border-color:#6af7ff;box-shadow:0 0 14px #35ddec55}.arena{position:relative;margin-top:12px;border:1px solid #317182;border-radius:14px;overflow:hidden;background:#091622;box-shadow:0 0 40px #00d9ff1c}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#020a11c9;transition:.2s}.overlay.off{opacity:0;pointer-events:none}.modal{text-align:center;background:#102536;padding:24px;border:1px solid #55dfeb;border-radius:14px;width:min(400px,90%)}.modal h1{margin:0 0 8px;letter-spacing:3px}.modal p{color:#aac2cd}.energy{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px}.track{height:9px;width:min(240px,45vw);background:#19303c;border-radius:9px;overflow:hidden}.fill{height:100%;width:50%;background:linear-gradient(90deg,#14bcd2,#9bffec)}.cards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.card{width:145px;text-align:left;position:relative}.card.sel{outline:2px solid #72f6ff;transform:translateY(-3px)}.card:disabled{opacity:.42;cursor:not-allowed}.card strong{display:block}.card small{color:#9cb7c2}.cost{float:right;color:#80fbff;font-weight:bold}.help{text-align:center;color:#8aa8b5;font:11px monospace;margin:12px 0}.stats{display:flex;justify-content:space-between;font:12px monospace;color:#b5cbd2;margin:8px 2px}.bar{height:7px;width:42%;background:#213440;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#5ef0fa}.bar.red i{background:#ff607e;float:right}
</style>
</head>
<body><main class="app"><header class="top"><div><div class="logo">GUYZO // UPRISING</div><div class="tag">NEON FRONTIER · SECTOR 09</div></div><div><button class="btn" id="pause">Ⅱ PAUSE</button></div></header>
<div class="stats"><span>YOUR CORE <span class="bar"><i id="ph" style="width:100%"></i></span></span><span id="clock">00:00</span><span><span class="bar red"><i id="eh" style="width:100%"></i></span> ENEMY CORE</span></div>
<section class="arena"><canvas id="field" width="960" height="500" aria-label="Battlefield"></canvas><div class="overlay" id="overlay"><div class="modal"><h1 id="title">GUYZO UPRISING</h1><p id="message">Deploy your crew, hold the lanes, and smash the enemy core.</p><button class="btn" id="start">DEPLOY</button></div></div></section>
<div class="energy"><b>ENERGY</b><div class="track"><div class="fill" id="energybar"></div></div><span id="energy">5 / 10</span></div><div class="cards" id="cards"></div><p class="help" id="help">CHOOSE A CARD, THEN CLICK A LANE TO DEPLOY · GUYZOS FIGHT AUTOMATICALLY</p></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const deck=[{name:'SCOUT',icon:'⚡',cost:2,hp:55,damage:12,range:80,speed:32,color:'#56f4ff',rate:.8},{name:'TANK',icon:'🛡',cost:4,hp:180,damage:25,range:34,speed:15,color:'#ffbd62',rate:1.2},{name:'SNIPER',icon:'◎',cost:3,hp:48,damage:30,range:170,speed:18,color:'#d89aff',rate:1.5},{name:'MEDIC',icon:'✚',cost:3,hp:75,damage:9,range:100,speed:20,color:'#9cffad',rate:1.1}];
let units=[],particles=[],energy=5,playerHP=1000,enemyHP=1000,elapsed=0,spawn=3,selected=-1,active=false,paused=false,ended=false,last=0;
const laneY=i=>150+i*125;
function makeButtons(){deck.forEach((c,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<span class="cost">${c.cost}⚡</span><strong>${c.icon} ${c.name}</strong><small>${['Fast striker','Heavy armor','Long range','Heals allies'][i]}</small>`;b.onclick=()=>{if(!active||paused||ended)return;if(energy<c.cost)return;selected=selected===i?-1:i;refresh()};$('cards').appendChild(b)})}
function refresh(){[...$('cards').children].forEach((b,i)=>{b.disabled=!active||paused||ended||energy<deck[i].cost;b.classList.toggle('sel',selected===i)});$('energy').textContent=`${energy.toFixed(1)} / 10`;$('energybar').style.width=`${energy*10}%`;$('ph').style.width=`${Math.max(0,playerHP/10)}%`;$('eh').style.width=`${Math.max(0,enemyHP/10)}%`;$('clock').textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(Math.floor(elapsed%60)).padStart(2,'0')}`}
function unit(card,lane,side,x){return{...card,lane,side,x:x??(side==='p'?130:830),max:card.hp,cd:Math.random()*.4}}
function deploy(c,lane,x){if(energy<c.cost)return;energy-=c.cost;units.push(unit(c,lane,'p',Math.max(110,Math.min(850,x))));selected=-1;refresh()}
canvas.addEventListener('pointerdown',e=>{if(!active||paused||ended||selected<0)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width,y=(e.clientY-r.top)*500/r.height,lane=Math.max(0,Math.min(2,Math.round((y-150)/125)));deploy(deck[selected],lane,x)});
function spawnEnemy(){const c=deck[Math.floor(Math.random()*Math.min(deck.length,elapsed<18?2:4))];units.push(unit(c,Math.floor(Math.random()*3),'e'))}
function win(player){active=false;ended=true;$('title').textContent=player?'VICTORY':'CORE BREACHED';$('message').textContent=player?'Enemy core destroyed! The sector is yours.':'Your core fell. Regroup and try again.';$('start').textContent='PLAY AGAIN';$('overlay').classList.remove('off');refresh()}
function update(dt){if(!active||paused||ended)return;elapsed+=dt;energy=Math.min(10,energy+dt*.5);spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(2.2,5-elapsed*.025)}for(const u of units){u.cd-=dt;const dir=u.side==='p'?1:-1;let target=null,d=Infinity;for(const v of units){if(v.side===u.side||v.lane!==u.lane)continue;const gap=(v.x-u.x)*dir;if(gap>=0&&gap<d){d=gap;target=v}}const core=(u.side==='p'?850:110),toCore=(core-u.x)*dir;if(target&&d<=u.range){if(u.cd<=0){u.cd=u.rate;target.hp-=u.damage;if(target.hp<=0)burst(target.x,laneY(target.lane)-22,target.color)}}else if(u.kind==='medic'&&u.side==='p'){const friend=units.find(v=>v.side==='p'&&v.lane===u.lane&&v!==u&&v.hp<v.max);if(friend&&Math.abs(friend.x-u.x)<u.range&&u.cd<=0){friend.hp=Math.min(friend.max,friend.hp+12);u.cd=u.rate}else if(!target)u.x+=dir*u.speed*dt}else if(!target&&toCore<=u.range){if(u.cd<=0){u.cd=u.rate;if(u.side==='p')enemyHP-=u.damage;else playerHP-=u.damage}}else if(!target)u.x+=dir*u.speed*dt;else if(d>u.range*.72)u.x+=dir*u.speed*dt*.3}units=units.filter(u=>u.hp>0&&u.x>70&&u.x<890);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(enemyHP<=0)win(true);else if(playerHP<=0)win(false);refresh()}
function burst(x,y,color){for(let i=0;i<8;i++){const a=Math.random()*6.28,v=25+Math.random()*80;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.45,color})}}
function draw(){ctx.clearRect(0,0,960,500);const g=ctx.createLinearGradient(0,0,0,500);g.addColorStop(0,'#0b1c2c');g.addColorStop(1,'#07131d');ctx.fillStyle=g;ctx.fillRect(0,0,960,500);for(let i=0;i<28;i++){let x=i*38;ctx.fillStyle=i%2?'#102839':'#142d3e';ctx.fillRect(x,45,28,75+((i*37)%70))}for(let l=0;l<3;l++){let y=laneY(l);ctx.fillStyle=l%2?'#112838':'#0d2230';ctx.fillRect(0,y-48,960,96);ctx.strokeStyle='#6befff33';ctx.setLineDash([12,12]);ctx.beginPath();ctx.moveTo(150,y+47);ctx.lineTo(810,y+47);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#9bb8c4';ctx.font='11px monospace';ctx.fillText(['UPPER','MID','LOWER'][l],15,y-30)}
 // perspective grid for 2.5D floor
 ctx.strokeStyle='#50d8e51a';for(let x=0;x<=960;x+=48){ctx.beginPath();ctx.moveTo(480,360);ctx.lineTo(x,500);ctx.stroke()}for(let y=375;y<500;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}
 drawCore(90,'#55f2ff');drawCore(870,'#ff577b');for(const u of units)drawUnit(u);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.28);ctx.fill()}ctx.globalAlpha=1}
function drawCore(x,color){ctx.save();ctx.translate(x,300);ctx.shadowColor=color;ctx.shadowBlur=22;ctx.fillStyle='#183647';ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-26,-48);ctx.lineTo(26,-48);ctx.lineTo(33,28);ctx.lineTo(0,48);ctx.lineTo(-33,28);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,12+Math.sin(elapsed*3)*2,0,6.28);ctx.fill();ctx.restore()}
function drawUnit(u){const y=laneY(u.lane);ctx.save();ctx.translate(u.x,y);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,2,20,6,0,0,6.28);ctx.fill();ctx.fillStyle='#15394a';ctx.strokeStyle=u.side==='p'?u.color:'#ff607c';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-12,-37,24,30,6);ctx.fill();ctx.stroke();ctx.fillStyle=u.color;ctx.beginPath();ctx.roundRect(-10,-52,20,18,6);ctx.fill();ctx.fillStyle='#102330';ctx.fillRect(-3,-46,10,5);ctx.fillStyle=u.color;ctx.fillRect(-16,-11,10,13);ctx.fillRect(6,-11,10,13);ctx.fillStyle='#162631';ctx.fillRect(-17,-62,34,4);ctx.fillStyle=u.side==='p'?'#65f7ff':'#ff5b7f';ctx.fillRect(-17,-62,34*Math.max(0,u.hp/u.max),4);ctx.restore()}
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}
$('start').onclick=()=>{units=[];particles=[];energy=5;playerHP=enemyHP=1000;elapsed=0;spawn=2;selected=-1;ended=false;paused=false;active=true;$('title').textContent='GUYZO UPRISING';$('start').textContent='DEPLOY';$('overlay').classList.add('off');refresh()};$('pause').onclick=()=>{if(!active||ended)return;paused=!paused;$('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';if(paused){$('title').textContent='PAUSED';$('message').textContent='The battlefield is on hold.';$('start').textContent='RESUME';$('overlay').classList.remove('off')}else $('overlay').classList.add('off');refresh()};window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p')$('pause').click()});makeButtons();refresh();requestAnimationFrame(frame)
})();
</script></body></html>
